<script>
function formatar(valor) {
    return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function calcular() {
    const salario = parseFloat(document.getElementById("salario").value) || 0;
    const descontos = parseFloat(document.getElementById("descontos").value) || 0;
    const adicionais = parseFloat(document.getElementById("adicionais").value) || 0;

    // INSS
    let inss = 0;

    if (salario <= 1621) {
        inss = salario * 0.075;
    } else if (salario <= 2902.84) {
        inss = (1621 * 0.075) + ((salario - 1621) * 0.09);
    } else if (salario <= 4354.27) {
        inss = (1621 * 0.075) +
               ((2902.84 - 1621) * 0.09) +
               ((salario - 2902.84) * 0.12);
    } else if (salario <= 8475.55) {
        inss = (1621 * 0.075) +
               ((2902.84 - 1621) * 0.09) +
               ((4354.27 - 2902.84) * 0.12) +
               ((salario - 4354.27) * 0.14);
    } else {
        inss = (1621 * 0.075) +
               ((2902.84 - 1621) * 0.09) +
               ((4354.27 - 2902.84) * 0.12) +
               ((8475.55 - 4354.27) * 0.14);
    }

    // Base IRRF
    let base = salario + adicionais - inss - descontos;

    let irrf = 0;

    if (base <= 2259.20) {
        irrf = 0;
    } else if (base <= 2826.65) {
        irrf = (base * 0.075) - 169.44;
    } else if (base <= 3751.05) {
        irrf = (base * 0.15) - 381.44;
    } else if (base <= 4664.68) {
        irrf = (base * 0.225) - 662.77;
    } else {
        irrf = (base * 0.275) - 896.00;
    }

    if (irrf < 0) irrf = 0;

    let liquido = salario + adicionais - inss - irrf - descontos;

    document.getElementById("resultado").innerHTML = `
        <p>INSS: ${formatar(inss)}</p>
        <p>IRRF: ${formatar(irrf)}</p>
        <p><strong>Salário Líquido: ${formatar(liquido)}</strong></p>
    `;
}
</script>
